name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  linux-x86_64:
    name: Build and publish Linux x86_64 release
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Verify release metadata
        shell: bash
        run: |
          set -euo pipefail
          version=$(nix eval --impure --raw --expr '(builtins.fromTOML (builtins.readFile ./Cargo.toml)).workspace.package.version')
          test "$RELEASE_TAG" = "v$version"
          test "$(jq -r .version crates/shadoword-desktop/package.json)" = "$version"
          test "$(jq -r .version crates/shadoword-desktop/src-tauri/tauri.conf.json)" = "$version"
          grep -Fq "## [$version]" CHANGELOG.md

      - name: Extract release notes
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]( |$)" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          test -s release-notes.md

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          api_cpu=$(nix build .#shadoword-api-source --no-link --print-out-paths -L)
          api_cuda=$(nix build .#shadoword-api-cuda-source --no-link --print-out-paths -L)
          api_vulkan=$(nix build .#shadoword-api-vulkan-source --no-link --print-out-paths -L)
          desktop=$(nix build .#shadoword-desktop-source --no-link --print-out-paths -L)
          desktop_cuda=$(nix build .#shadoword-desktop-cuda-source --no-link --print-out-paths -L)
          desktop_vulkan=$(nix build .#shadoword-desktop-vulkan-source --no-link --print-out-paths -L)

          mkdir -p dist/stage/api-cpu/bin dist/stage/api-cuda/bin dist/stage/api-vulkan/bin dist/stage/desktop/bin dist/stage/desktop-cuda/bin dist/stage/desktop-vulkan/bin
          install -m755 "$api_cpu/bin/.shadoword-api-wrapped" dist/stage/api-cpu/bin/shadoword-api
          install -m755 "$api_cuda/bin/.shadoword-api-wrapped" dist/stage/api-cuda/bin/shadoword-api
          install -m755 "$api_vulkan/bin/.shadoword-api-wrapped" dist/stage/api-vulkan/bin/shadoword-api
          install -m755 "$desktop/bin/.shadoword-wrapped" dist/stage/desktop/bin/shadoword
          install -m755 "$desktop_cuda/bin/.shadoword-wrapped" dist/stage/desktop-cuda/bin/shadoword
          install -m755 "$desktop_vulkan/bin/.shadoword-wrapped" dist/stage/desktop-vulkan/bin/shadoword
          cp -R "$desktop/share" dist/stage/desktop/
          cp -R "$desktop_cuda/share" dist/stage/desktop-cuda/
          cp -R "$desktop_vulkan/share" dist/stage/desktop-vulkan/

          cp README.md CHANGELOG.md shadoword-logo.svg dist/stage/api-cpu/
          cp README.md CHANGELOG.md shadoword-logo.svg dist/stage/api-cuda/
          cp README.md CHANGELOG.md shadoword-logo.svg dist/stage/api-vulkan/
          cp README.md CHANGELOG.md shadoword-logo.svg dist/stage/desktop/
          cp README.md CHANGELOG.md shadoword-logo.svg dist/stage/desktop-cuda/
          cp README.md CHANGELOG.md shadoword-logo.svg dist/stage/desktop-vulkan/

          tar -C dist/stage/api-cpu -czf dist/shadoword-api-cpu-x86_64-linux.tar.gz .
          tar -C dist/stage/api-cuda -czf dist/shadoword-api-cuda-x86_64-linux.tar.gz .
          tar -C dist/stage/api-vulkan -czf dist/shadoword-api-vulkan-x86_64-linux.tar.gz .
          tar -C dist/stage/desktop -czf dist/shadoword-desktop-x86_64-linux.tar.gz .
          tar -C dist/stage/desktop-cuda -czf dist/shadoword-desktop-cuda-x86_64-linux.tar.gz .
          tar -C dist/stage/desktop-vulkan -czf dist/shadoword-desktop-vulkan-x86_64-linux.tar.gz .
          (cd dist && sha256sum ./*.tar.gz > SHA256SUMS)

          version=${RELEASE_TAG#v}
          release_base="https://github.com/Fractal-Tess/shadoword/releases/download/$RELEASE_TAG"
          sri_hash() {
            nix hash convert --hash-algo sha256 --to sri "$(sha256sum "$1" | cut -d' ' -f1)"
          }
          jq -n \
            --arg version "$version" \
            --arg release_base "$release_base" \
            --arg api_hash "$(sri_hash dist/shadoword-api-cpu-x86_64-linux.tar.gz)" \
            --arg cuda_hash "$(sri_hash dist/shadoword-api-cuda-x86_64-linux.tar.gz)" \
            --arg vulkan_hash "$(sri_hash dist/shadoword-api-vulkan-x86_64-linux.tar.gz)" \
            --arg desktop_hash "$(sri_hash dist/shadoword-desktop-x86_64-linux.tar.gz)" \
            --arg desktop_cuda_hash "$(sri_hash dist/shadoword-desktop-cuda-x86_64-linux.tar.gz)" \
            --arg desktop_vulkan_hash "$(sri_hash dist/shadoword-desktop-vulkan-x86_64-linux.tar.gz)" \
            '{
              version: $version,
              systems: {
                "x86_64-linux": {
                  "shadoword-api": {
                    url: ($release_base + "/shadoword-api-cpu-x86_64-linux.tar.gz"),
                    hash: $api_hash
                  },
                  "shadoword-api-cuda": {
                    url: ($release_base + "/shadoword-api-cuda-x86_64-linux.tar.gz"),
                    hash: $cuda_hash
                  },
                  "shadoword-api-vulkan": {
                    url: ($release_base + "/shadoword-api-vulkan-x86_64-linux.tar.gz"),
                    hash: $vulkan_hash
                  },
                  "shadoword-desktop": {
                    url: ($release_base + "/shadoword-desktop-x86_64-linux.tar.gz"),
                    hash: $desktop_hash
                  },
                  "shadoword-desktop-cuda": {
                    url: ($release_base + "/shadoword-desktop-cuda-x86_64-linux.tar.gz"),
                    hash: $desktop_cuda_hash
                  },
                  "shadoword-desktop-vulkan": {
                    url: ($release_base + "/shadoword-desktop-vulkan-x86_64-linux.tar.gz"),
                    hash: $desktop_vulkan_hash
                  }
                }
              }
            }' > dist/nix-release-artifacts.json

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract CPU image metadata
        id: docker-cpu-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/fractal-tess/shadoword-backend
            docker.io/vgfractal/shadoword-backend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ env.RELEASE_TAG }}
            type=semver,pattern={{version}}-cpu,value=${{ env.RELEASE_TAG }}
            type=raw,value=cpu
            type=raw,value=latest

      - name: Build and push CPU image
        shell: bash
        run: |
          set -euo pipefail
          image=$(nix build .#shadoword-container-cpu --no-link --print-out-paths -L)
          mapfile -t tags <<'TAGS'
          ${{ steps.docker-cpu-meta.outputs.tags }}
          TAGS
          ./nix/publish-container.sh "$image" shadoword-backend:cpu "${tags[@]}"

      - name: Extract CUDA image metadata
        id: docker-cuda-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/fractal-tess/shadoword-backend
            docker.io/vgfractal/shadoword-backend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-cuda,value=${{ env.RELEASE_TAG }}
            type=raw,value=cuda

      - name: Build and push CUDA image
        shell: bash
        run: |
          set -euo pipefail
          image=$(nix build .#shadoword-container-cuda --no-link --print-out-paths -L)
          mapfile -t tags <<'TAGS'
          ${{ steps.docker-cuda-meta.outputs.tags }}
          TAGS
          ./nix/publish-container.sh "$image" shadoword-backend:cuda "${tags[@]}"

      - name: Extract Vulkan image metadata
        id: docker-vulkan-meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/fractal-tess/shadoword-backend
            docker.io/vgfractal/shadoword-backend
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}-vulkan,value=${{ env.RELEASE_TAG }}
            type=raw,value=vulkan

      - name: Build and push Vulkan image
        shell: bash
        run: |
          set -euo pipefail
          image=$(nix build .#shadoword-container-vulkan --no-link --print-out-paths -L)
          mapfile -t tags <<'TAGS'
          ${{ steps.docker-vulkan-meta.outputs.tags }}
          TAGS
          ./nix/publish-container.sh "$image" shadoword-backend:vulkan "${tags[@]}"

      - name: Verify published image variants
        shell: bash
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          for image in ghcr.io/fractal-tess/shadoword-backend docker.io/vgfractal/shadoword-backend; do
            for tag in "$version" "$version-cpu" "$version-cuda" "$version-vulkan"; do
              docker manifest inspect "$image:$tag" >/dev/null
            done
          done

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: Shadoword ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          fail_on_unmatched_files: true
          files: |
            dist/shadoword-api-cpu-x86_64-linux.tar.gz
            dist/shadoword-api-cuda-x86_64-linux.tar.gz
            dist/shadoword-api-vulkan-x86_64-linux.tar.gz
            dist/shadoword-desktop-x86_64-linux.tar.gz
            dist/shadoword-desktop-cuda-x86_64-linux.tar.gz
            dist/shadoword-desktop-vulkan-x86_64-linux.tar.gz
            dist/SHA256SUMS
            dist/nix-release-artifacts.json

      # Nix consumers only get prebuilt binaries while nix/release-artifacts.json
      # matches the workspace version, so every version bump silently drops them
      # back to source builds until the pin lands. That makes this a release step
      # rather than something a human is expected to remember afterwards.
      - name: Pin release artifacts on the default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          version=${RELEASE_TAG#v}
          git fetch --depth=1 origin "$DEFAULT_BRANCH"
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

          branch_version=$(nix eval --impure --raw --expr '(builtins.fromTOML (builtins.readFile ./Cargo.toml)).workspace.package.version')
          if [ "$branch_version" != "$version" ]; then
            echo "::warning::$DEFAULT_BRANCH is at $branch_version, not $version; leaving the artifact pin alone"
            exit 0
          fi

          cp dist/nix-release-artifacts.json nix/release-artifacts.json
          if git diff --quiet -- nix/release-artifacts.json; then
            echo "nix/release-artifacts.json already pins $version"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add nix/release-artifacts.json
          git commit -m "build: pin $RELEASE_TAG release artifacts"
          git push origin "HEAD:$DEFAULT_BRANCH"

name: Docker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "flake.nix"
      - "flake.lock"
      - "nix/publish-container.sh"
      - "crates/**"
      - ".github/workflows/docker.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GHCR_IMAGE_NAME: ghcr.io/fractal-tess/shadoword-backend
  DOCKERHUB_IMAGE_NAME: docker.io/vgfractal/shadoword-backend

jobs:
  build-and-push:
    name: Build and push ${{ matrix.variant }} image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda, vulkan]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v13

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.GHCR_IMAGE_NAME }}
            ${{ env.DOCKERHUB_IMAGE_NAME }}
          flavor: latest=false
          tags: |
            type=sha,format=short,prefix=${{ matrix.variant }}-
            type=sha,format=short,enable=${{ matrix.variant == 'cpu' }}

      - name: Build and push ${{ matrix.variant }} image
        shell: bash
        run: |
          set -euo pipefail
          image=$(nix build ".#shadoword-container-${{ matrix.variant }}" --no-link --print-out-paths -L)
          mapfile -t tags <<'TAGS'
          ${{ steps.meta.outputs.tags }}
          TAGS
          ./nix/publish-container.sh "$image" "shadoword-backend:${{ matrix.variant }}" "${tags[@]}"

# Astro's static/NGINX recipe config, verbatim except for the three additions
# marked ADDED below. https://docs.astro.build/en/recipes/docker/

worker_processes  1;

events {
  worker_connections  1024;
}

http {
  server {
    listen 8080;
    server_name   _;

    root   /usr/share/nginx/html;
    index  index.html index.htm;
    include /etc/nginx/mime.types;

    gzip on;
    # ADDED. Without it nginx sends no `Vary: Accept-Encoding`, so a CDN or proxy
    # may hand a gzipped body to a client that never advertised gzip.
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

    error_page 404 /404.html;
    location = /404.html {
            root /usr/share/nginx/html;
            internal;
    }

    # ADDED. Astro content-hashes every filename it emits into _astro/, which is
    # precisely what makes a permanent cache safe: the name changes when the
    # bytes do. This is the single largest win available here — without it the
    # fonts and CSS are refetched on every visit.
    location /_astro/ {
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
    }

    # ADDED. Files under public/ keep the names we gave them — the hero plate is
    # /images/hero-spectrum.webp both before and after it is regenerated — so
    # they get an expiring cache rather than an immutable one. Without this block
    # they fall into `location /` below and inherit `no-cache`, which refetches
    # the largest asset on the page on every single visit.
    location ~* ^/(images|favicon)/ {
            add_header Cache-Control "public, max-age=604800";
            access_log off;
    }

    location / {
            try_files $uri $uri/index.html =404;
            # ADDED. Files under public/ keep the names we gave them, and the
            # document names the hashed assets above, so neither may be cached
            # hard — a stale index.html pins the whole site to a past deploy.
            # This block is where `/` is actually answered from, so the header
            # belongs here rather than on a `location = /index.html`.
            add_header Cache-Control "no-cache";
    }
  }
}

[workspace]
members = [
  "crates/shadoword-core",
  "crates/shadoword-api",
  "crates/shadoword-desktop/src-tauri",
  "crates/shadoword-model-whisper",
  "crates/shadoword-shared",
]
resolver = "2"

[workspace.package]
version = "0.10.6"
edition = "2021"
rust-version = "1.88"
license = "MIT"
authors = ["Fractal-Tess"]
repository = "https://github.com/Fractal-Tess/shadoword"

[workspace.dependencies]
anyhow = "1.0.100"
base64 = "0.22.1"
arboard = "3.6.1"
audiopus_sys = { version = "0.2.2", features = ["dynamic"] }
axum = { version = "0.8.4", features = ["macros"] }
clap = { version = "4.5.50", features = ["derive", "env"] }
cpal = "0.16.0"
directories = "6.0.0"
enigo = "0.6.1"
futures-util = "0.3.31"
handy-keys = "0.3.2"
hound = "3.5.1"
log = "0.4.28"
opus = "0.3.1"
reqwest = { version = "0.12.24", default-features = false, features = ["blocking", "json", "rustls-tls"] }
rubato = "0.16.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
sha2 = "0.10.9"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio-tungstenite = { version = "0.28.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["fmt", "env-filter"] }
transcribe-rs = { version = "0.3.8", features = ["whisper-cpp"] }
tray-icon = "0.21"
wait-timeout = "0.2.1"

# Temporary Rust 1.88 compatibility patches for upstream rc.25.
[patch.crates-io]
specta = { path = "vendor/specta" }
specta-serde = { path = "vendor/specta-serde" }

[workspace]
members = [
  "crates/shadoword-core",
  "crates/shadoword-api",
  "crates/shadoword-desktop/src-tauri",
  "crates/shadoword-model-whisper",
  "crates/shadoword-shared",
]
resolver = "2"

[workspace.package]
version = "0.13.0"
edition = "2021"
rust-version = "1.94"
license = "MIT"
authors = ["Fractal-Tess"]
repository = "https://github.com/Fractal-Tess/shadoword"

[workspace.dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
arboard = "3.6.1"
audiopus_sys = { version = "0.2.2", features = ["dynamic"] }
axum = { version = "0.8.9", features = ["macros"] }
clap = { version = "4.6.6", features = ["derive", "env"] }
cpal = "0.18.1"
directories = "6.0.0"
enigo = "0.6.1"
futures-util = "0.3.33"
getrandom = "0.4.3"
handy-keys = "0.3.4"
hex = "0.4.3"
hound = "3.5.1"
log = "0.4.33"
opus = "0.3.1"
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "json", "rustls"] }
rubato = "4.0.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
specta = { version = "=2.0.0-rc.25", features = ["derive"] }
specta-typescript = "=0.0.12"
sha2 = "0.11.0"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = ["connect", "rustls-tls-native-roots"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["fmt", "env-filter"] }
transcribe-rs = { version = "0.3.11", features = ["whisper-cpp"] }
tray-icon = "0.24"
wait-timeout = "0.2.1"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = 3
panic = "abort"
strip = "symbols"

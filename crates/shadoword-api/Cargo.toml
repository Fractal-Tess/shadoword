[package]
name = "shadoword-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
whisper-vulkan = ["shadoword-core/whisper-vulkan"]
whisper-cuda = ["shadoword-core/whisper-cuda"]

[dependencies]
anyhow.workspace = true
axum = { workspace = true, features = ["ws"] }
clap.workspace = true
futures-util.workspace = true
opus.workspace = true
serde.workspace = true
serde_json.workspace = true
shadoword-core = { path = "../shadoword-core", default-features = false, features = ["local-whisper"] }
tokio.workspace = true
tower.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
shadoword-shared = { path = "../shadoword-shared" }

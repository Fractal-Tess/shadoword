[package]
name = "shadoword-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Tauri desktop shell for Shadoword"

[features]
default = ["local-runtime"]
local-runtime = ["shadoword-core/local-whisper"]
remote-client = []
custom-protocol = ["tauri/custom-protocol"]
whisper-vulkan = ["local-runtime", "shadoword-core/whisper-vulkan"]
whisper-cuda = ["local-runtime", "shadoword-core/whisper-cuda"]

[lib]
name = "shadoword_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
anyhow.workspace = true
base64.workspace = true
arboard.workspace = true
audiopus_sys.workspace = true
enigo.workspace = true
futures-util.workspace = true
handy-keys.workspace = true
log.workspace = true
opus.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
shadoword-core = { path = "../../shadoword-core", default-features = false, features = ["desktop-audio"] }
specta.workspace = true
specta-typescript.workspace = true
tauri = { version = "2.11.3", features = ["image-png", "tray-icon"] }
tauri-plugin-log = "2"
tauri-specta.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true
tracing.workspace = true
wait-timeout.workspace = true

[dev-dependencies]
tempfile = "3.23.0"
